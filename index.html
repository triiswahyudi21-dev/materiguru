<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Guru - E-Learning IPS</title>

  <!-- Google Font & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Babel Standalone untuk JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>

  <!-- Import Map React & Firebase -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken } from 'firebase/auth';
    import { 
      getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc, writeBatch 
    } from 'firebase/firestore';
    import { 
      BookOpen, Users, HelpCircle, Award, Plus, Trash2, Edit3, Clock, 
      AlertTriangle, RefreshCw, Square, CheckCircle, Search, UserX, ShieldAlert
    } from 'lucide-react';

    // Konfigurasi Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD3M8FfqHdzCRO3VCKB24xPEcEZgVVK--M",
      authDomain: "gen-lang-client-0031221493.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0031221493-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gen-lang-client-0031221493",
      storageBucket: "gen-lang-client-0031221493.firebasestorage.app",
      messagingSenderId: "514951591302",
      appId: "1:514951591302:web:65d128106e2d2f3663e807",
      measurementId: "G-VF7M8CDSYQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'elearning-ips-v3';

    // BroadcastChannel Sync Realtime
    const broadcast = typeof window !== 'undefined' && 'BroadcastChannel' in window
      ? new BroadcastChannel('elearning_ips_realtime_channel')
      : null;

    function TeacherApp() {
      const [activeTab, setActiveTab] = useState('monitoring'); // monitoring | materials | questions | students | scores

      // State Data Utama
      const [studentsList, setStudentsList] = useState([]);
      const [materials, setMaterials] = useState([]);
      const [questions, setQuestions] = useState([]);
      const [presence, setPresence] = useState({});
      const [scores, setScores] = useState([]);

      // Filter State
      const [filterKelas, setFilterKelas] = useState('7');
      const [filterSubKelas, setFilterSubKelas] = useState('A');
      const [searchTerm, setSearchTerm] = useState('');

      // Form Modals / Input States
      const [newStudentName, setNewStudentName] = useState('');
      const [newStudentNISN, setNewStudentNISN] = useState('');

      const [matForm, setMatForm] = useState({ id: '', title: '', content: '', durationMinutes: 15, source: '', imageUrl: '' });
      const [isEditMat, setIsEditMat] = useState(false);

      const [questForm, setQuestForm] = useState({ id: '', materialId: '', type: 'pg', questionText: '', optionA: '', optionB: '', optionC: '', optionD: '', correctAnswer: 'A' });

      // Synchronize Firebase Auth & Firestore Listeners
      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.log("Firebase Fallback Mode");
          }
        };
        initAuth();

        // 1. Sync Siswa
        const unsubStudents = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'students'), (snap) => {
          const list = snap.docs.map(doc => doc.data());
          setStudentsList(list);
        });

        // 2. Sync Materi
        const unsubMaterials = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), (snap) => {
          const list = snap.docs.map(doc => doc.data());
          setMaterials(list);
        });

        // 3. Sync Soal
        const unsubQuestions = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'questions'), (snap) => {
          const list = snap.docs.map(doc => doc.data());
          setQuestions(list);
        });

        // 4. Sync Presence (Monitoring Belajar)
        const unsubPresence = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'student_presence'), (snap) => {
          const map = {};
          snap.docs.forEach(d => { map[d.id] = d.data(); });
          setPresence(map);
        });

        // 5. Sync Nilai Kuis
        const unsubScores = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'scores'), (snap) => {
          const list = snap.docs.map(doc => doc.data());
          setScores(list);
        });

        return () => {
          unsubStudents();
          unsubMaterials();
          unsubQuestions();
          unsubPresence();
          unsubScores();
        };
      }, []);

      // Broadcast channel listener untuk real-time sync lokal
      useEffect(() => {
        if (!broadcast) return;
        const handleMessage = (event) => {
          const { type, payload } = event.data || {};
          if (type === 'STUDENT_PRESENCE_UPDATE' && payload) {
            setPresence(prev => ({ ...prev, [payload.id]: payload }));
          }
        };
        broadcast.addEventListener('message', handleMessage);
        return () => broadcast.removeEventListener('message', handleMessage);
      }, []);

      // === FITUR BARU MANAGEMENT SESI SISWA ===

      // 1. Hentikan Sesi Siswa
      const handleStopSession = async (presenceId) => {
        const item = presence[presenceId];
        if (!item) return;

        const updated = { ...item, status: 'stopped', remainingSeconds: 0, lastUpdated: Date.now() };
        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presenceId), updated);
        if (broadcast) broadcast.postMessage({ type: 'TEACHER_STOP_SESSION', payload: updated });
      };

      // 2. Reset Sesi Siswa
      const handleResetSession = async (presenceId) => {
        const item = presence[presenceId];
        if (!item) return;

        const mat = materials.find(m => m.id === item.materialId);
        const resetSeconds = mat ? (mat.durationMinutes || 15) * 60 : 900;

        const updated = { 
          ...item, 
          status: 'active', 
          remainingSeconds: resetSeconds, 
          lastUpdated: Date.now() 
        };

        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presenceId), updated);
        if (broadcast) broadcast.postMessage({ type: 'TEACHER_RESET_STATUS', payload: updated });
      };

      // 3. Hapus Sesi Siswa Individual
      const handleDeleteSession = async (presenceId) => {
        if (confirm("Apakah Anda yakin ingin menghapus data pantauan sesi belajar siswa ini?")) {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presenceId));
        }
      };

      // === FITUR BARU HAPUS KELAS TERPILIH ===
      const handleDeleteSelectedClass = async () => {
        const targetClassStr = `Kelas ${filterKelas}${filterSubKelas}`;
        const confirmText = `APAKAH ANDA YAKIN INGIN MENGHAPUS SEMUA DATA PADA ${targetClassStr}?\n\nTindakan ini akan menghapus:\n1. Seluruh Daftar Siswa di ${targetClassStr}\n2. Seluruh Record Sesi Belajar di ${targetClassStr}`;
        
        if (confirm(confirmText)) {
          const batch = writeBatch(db);

          // A. Hapus siswa pada kelas terpilih
          const classStudents = studentsList.filter(s => 
            (s.kelas === filterKelas || s.kelas === `Kelas ${filterKelas}`) &&
            (s.subKelas === filterSubKelas || s.subKelas === `Rombel ${filterSubKelas}`)
          );
          classStudents.forEach(s => {
            batch.delete(doc(db, 'artifacts', appId, 'public', 'data', 'students', s.id));
          });

          // B. Hapus presence pada kelas terpilih
          Object.values(presence).forEach(p => {
            if (p.kelas === `${filterKelas}${filterSubKelas}`) {
              batch.delete(doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', p.id));
            }
          });

          await batch.commit();
          alert(`Berhasil menghapus seluruh data siswa dan sesi pada ${targetClassStr}.`);
        }
      };

      // === CRUD SISWA ===
      const handleAddStudent = async (e) => {
        e.preventDefault();
        if (!newStudentName.trim()) return;

        const newId = 'std_' + Date.now();
        const studentObj = {
          id: newId,
          name: newStudentName.trim(),
          nisn: newStudentNISN.trim(),
          kelas: filterKelas,
          subKelas: filterSubKelas,
          createdAt: Date.now()
        };

        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', newId), studentObj);
        setNewStudentName('');
        setNewStudentNISN('');
      };

      const handleDeleteStudent = async (studentId) => {
        if (confirm("Hapus siswa ini dari daftar kelas?")) {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', studentId));
        }
      };

      // === CRUD MATERI ===
      const handleSaveMaterial = async (e) => {
        e.preventDefault();
        if (!matForm.title || !matForm.content) return;

        const matId = isEditMat ? matForm.id : 'mat_' + Date.now();
        const matData = {
          id: matId,
          title: matForm.title,
          content: matForm.content,
          durationMinutes: parseInt(matForm.durationMinutes) || 15,
          source: matForm.source || '',
          imageUrl: matForm.imageUrl || '',
          kelas: filterKelas,
          subKelasTarget: filterSubKelas,
          createdAt: Date.now()
        };

        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', matId), matData);
        setMatForm({ id: '', title: '', content: '', durationMinutes: 15, source: '', imageUrl: '' });
        setIsEditMat(false);
      };

      const handleDeleteMaterial = async (id) => {
        if (confirm("Hapus materi ini? Semua soal terkait juga akan terpengaruh.")) {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id));
        }
      };

      // === CRUD SOAL ===
      const handleSaveQuestion = async (e) => {
        e.preventDefault();
        if (!questForm.materialId || !questForm.questionText) return;

        const qId = questForm.id || 'q_' + Date.now();
        const qData = {
          ...questForm,
          id: qId,
          createdAt: Date.now()
        };

        await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'questions', qId), qData);
        setQuestForm({ id: '', materialId: '', type: 'pg', questionText: '', optionA: '', optionB: '', optionC: '', optionD: '', correctAnswer: 'A' });
      };

      const handleDeleteQuestion = async (id) => {
        if (confirm("Hapus soal ini?")) {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'questions', id));
        }
      };

      // Filter List Sesuai Pilihan Kelas & Rombel
      const filteredStudents = studentsList.filter(s => 
        (s.kelas === filterKelas || s.kelas === `Kelas ${filterKelas}`) && 
        (s.subKelas === filterSubKelas || s.subKelas === `Rombel ${filterSubKelas}`) &&
        s.name.toLowerCase().includes(searchTerm.toLowerCase())
      );

      const filteredPresenceList = Object.values(presence).filter(p => 
        p.kelas === `${filterKelas}${filterSubKelas}` &&
        p.studentName.toLowerCase().includes(searchTerm.toLowerCase())
      );

      const filteredMaterials = materials.filter(m => 
        m.kelas === filterKelas && (m.subKelasTarget === 'semua' || m.subKelasTarget === filterSubKelas)
      );

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
          {/* Header Portal Guru */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-gradient-to-tr from-blue-600 to-indigo-600 p-2.5 rounded-2xl shadow-lg shadow-blue-500/20">
                  <BookOpen className="w-6 h-6 text-white" />
                </div>
                <div>
                  <h1 className="text-base font-extrabold text-white">Portal Guru - Dashboard Pengajar</h1>
                  <p className="text-xs text-slate-400">E-Learning Mata Pelajaran IPS</p>
                </div>
              </div>

              {/* Selector Kelas, Rombel & Tombol Hapus Kelas */}
              <div className="flex flex-wrap items-center gap-2">
                <div className="flex items-center gap-1.5 bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-xs">
                  <span className="text-slate-400 font-medium">Kelas:</span>
                  <select 
                    value={filterKelas} 
                    onChange={e => setFilterKelas(e.target.value)} 
                    className="bg-transparent text-white font-bold outline-none cursor-pointer"
                  >
                    <option value="7" className="bg-slate-900">Kelas 7</option>
                    <option value="8" className="bg-slate-900">Kelas 8</option>
                    <option value="9" className="bg-slate-900">Kelas 9</option>
                  </select>
                </div>

                <div className="flex items-center gap-1.5 bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-xs">
                  <span className="text-slate-400 font-medium">Rombel:</span>
                  <select 
                    value={filterSubKelas} 
                    onChange={e => setFilterSubKelas(e.target.value)} 
                    className="bg-transparent text-white font-bold outline-none cursor-pointer"
                  >
                    <option value="A" className="bg-slate-900">Rombel A</option>
                    <option value="B" className="bg-slate-900">Rombel B</option>
                    <option value="C" className="bg-slate-900">Rombel C</option>
                    <option value="D" className="bg-slate-900">Rombel D</option>
                  </select>
                </div>

                <button 
                  onClick={handleDeleteSelectedClass}
                  className="bg-rose-600/20 hover:bg-rose-600 text-rose-300 hover:text-white border border-rose-500/30 font-bold px-3 py-1.5 rounded-xl text-xs transition-all flex items-center gap-1.5"
                  title={`Hapus Seluruh Data Kelas ${filterKelas}${filterSubKelas}`}
                >
                  <Trash2 className="w-3.5 h-3.5" />
                  <span>Hapus Kelas {filterKelas}{filterSubKelas}</span>
                </button>
              </div>
            </div>

            {/* Sub-Navigasi Tab */}
            <div className="max-w-7xl mx-auto px-4 flex gap-2 overflow-x-auto border-t border-slate-800/60 pt-2 pb-2">
              <button 
                onClick={() => setActiveTab('monitoring')} 
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${activeTab === 'monitoring' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
              >
                <Clock className="w-4 h-4"/> Monitoring Realtime Sesi
              </button>

              <button 
                onClick={() => setActiveTab('students')} 
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${activeTab === 'students' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
              >
                <Users className="w-4 h-4"/> Data Siswa ({filteredStudents.length})
              </button>

              <button 
                onClick={() => setActiveTab('materials')} 
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${activeTab === 'materials' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
              >
                <BookOpen className="w-4 h-4"/> Kelola Materi IPS
              </button>

              <button 
                onClick={() => setActiveTab('questions')} 
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${activeTab === 'questions' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
              >
                <HelpCircle className="w-4 h-4"/> Bank Soal & Evaluasi
              </button>

              <button 
                onClick={() => setActiveTab('scores')} 
                className={`px-4 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 whitespace-nowrap ${activeTab === 'scores' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
              >
                <Award className="w-4 h-4"/> Rekap Nilai Evaluasi
              </button>
            </div>
          </header>

          <main className="max-w-7xl mx-auto px-4 py-6 flex-1 w-full space-y-6">
            {/* TAB 1: MONITORING REALTIME SESI SISWA */}
            {activeTab === 'monitoring' && (
              <div className="space-y-4">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-6 shadow-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                  <div>
                    <h2 className="text-lg font-extrabold text-white flex items-center gap-2">
                      <Clock className="w-5 h-5 text-blue-400 animate-pulse"/>
                      Pantauan Kehadiran & Sesi Belajar Realtime
                    </h2>
                    <p className="text-slate-400 text-xs mt-1">
                      Menampilkan status siswa Kelas {filterKelas}{filterSubKelas} yang sedang membaca materi. Anda dapat menghentikan, mereset, atau menghapus sesi.
                    </p>
                  </div>

                  <div className="relative w-full sm:w-64">
                    <Search className="w-4 h-4 absolute left-3 top-3 text-slate-500" />
                    <input 
                      type="text" 
                      placeholder="Cari Nama Siswa..." 
                      value={searchTerm}
                      onChange={e => setSearchTerm(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-9 pr-3 py-2 text-xs text-white outline-none focus:border-blue-500"
                    />
                  </div>
                </div>

                {/* Tabel Realtime Presence */}
                <div className="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-xl">
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr className="bg-slate-950/80 border-b border-slate-800 text-slate-400 font-semibold">
                          <th className="p-4">Nama Siswa</th>
                          <th className="p-4">Materi Dibaca</th>
                          <th className="p-4">Sisa Waktu</th>
                          <th className="p-4">Status Sesi</th>
                          <th className="p-4 text-center">Aksi Sesi Siswa</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {filteredPresenceList.map((p) => {
                          const mins = Math.floor((p.remainingSeconds || 0) / 60);
                          const secs = (p.remainingSeconds || 0) % 60;
                          const timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                          return (
                            <tr key={p.id} className="hover:bg-slate-800/40 transition-all">
                              <td className="p-4 font-bold text-white">{p.studentName}</td>
                              <td className="p-4 text-slate-300">{p.materialTitle}</td>
                              <td className="p-4 font-mono font-bold text-amber-400">{timeStr}</td>
                              <td className="p-4">
                                {p.status === 'active' && (
                                  <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1.5 w-max">
                                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Membaca
                                  </span>
                                )}
                                {p.status === 'warning' && (
                                  <span className="bg-yellow-500/10 text-yellow-400 border border-yellow-500/20 px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1.5 w-max">
                                    <AlertTriangle className="w-3.5 h-3.5 text-yellow-400"/> Pindah Tab
                                  </span>
                                )}
                                {p.status === 'completed' && (
                                  <span className="bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1.5 w-max">
                                    <CheckCircle className="w-3.5 h-3.5 text-blue-400"/> Selesai Baca
                                  </span>
                                )}
                                {p.status === 'stopped' && (
                                  <span className="bg-rose-500/10 text-rose-400 border border-rose-500/20 px-2.5 py-1 rounded-lg text-[11px] font-bold flex items-center gap-1.5 w-max">
                                    <Square className="w-3.5 h-3.5 text-rose-400"/> Dihentikan
                                  </span>
                                )}
                              </td>
                              <td className="p-4">
                                <div className="flex items-center justify-center gap-2">
                                  {/* Tombol Hentikan Sesi */}
                                  <button 
                                    onClick={() => handleStopSession(p.id)}
                                    title="Hentikan Sesi Belajar Siswa"
                                    className="p-1.5 bg-amber-500/10 hover:bg-amber-500 text-amber-400 hover:text-slate-950 rounded-lg border border-amber-500/20 transition-all"
                                  >
                                    <Square className="w-4 h-4"/>
                                  </button>

                                  {/* Tombol Reset Sesi */}
                                  <button 
                                    onClick={() => handleResetSession(p.id)}
                                    title="Reset Waktu & Status Siswa"
                                    className="p-1.5 bg-blue-500/10 hover:bg-blue-500 text-blue-400 hover:text-white rounded-lg border border-blue-500/20 transition-all"
                                  >
                                    <RefreshCw className="w-4 h-4"/>
                                  </button>

                                  {/* Tombol Hapus Sesi */}
                                  <button 
                                    onClick={() => handleDeleteSession(p.id)}
                                    title="Hapus Record Sesi Ini"
                                    className="p-1.5 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white rounded-lg border border-rose-500/20 transition-all"
                                  >
                                    <Trash2 className="w-4 h-4"/>
                                  </button>
                                </div>
                              </td>
                            </tr>
                          );
                        })}

                        {filteredPresenceList.length === 0 && (
                          <tr>
                            <td colSpan="5" className="p-8 text-center text-slate-500 text-xs">
                              Belum ada aktivitas sesi membaca siswa pada Kelas {filterKelas}{filterSubKelas}.
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 2: DATA SISWA PER KELAS */}
            {activeTab === 'students' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                {/* Form Tambah Siswa */}
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4 h-fit">
                  <h3 className="text-base font-extrabold text-white flex items-center gap-2">
                    <Users className="w-5 h-5 text-blue-400" /> Tambah Siswa Baru
                  </h3>
                  <p className="text-slate-400 text-xs">
                    Siswa yang ditambahkan akan otomatis muncul di menu drop-down Portal Siswa pada Kelas {filterKelas}{filterSubKelas}.
                  </p>

                  <form onSubmit={handleAddStudent} className="space-y-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Nama Lengkap Siswa</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="Contoh: Ahmad Rizky" 
                        value={newStudentName}
                        onChange={e => setNewStudentName(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-blue-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">NISN (Opsional)</label>
                      <input 
                        type="text" 
                        placeholder="Contoh: 0081234567" 
                        value={newStudentNISN}
                        onChange={e => setNewStudentNISN(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white outline-none focus:border-blue-500"
                      />
                    </div>

                    <button 
                      type="submit" 
                      className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl transition-all shadow-lg shadow-blue-600/30 text-xs flex justify-center items-center gap-2"
                    >
                      <Plus className="w-4 h-4"/> Tambahkan ke Kelas {filterKelas}{filterSubKelas}
                    </button>
                  </form>
                </div>

                {/* Tabel Daftar Siswa */}
                <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-xl p-6 space-y-4">
                  <div className="flex justify-between items-center gap-4">
                    <h3 className="text-base font-extrabold text-white">
                      Daftar Siswa Kelas {filterKelas}{filterSubKelas}
                    </h3>
                    <div className="relative w-48">
                      <Search className="w-3.5 h-3.5 absolute left-3 top-2.5 text-slate-500" />
                      <input 
                        type="text" 
                        placeholder="Cari nama..." 
                        value={searchTerm}
                        onChange={e => setSearchTerm(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl pl-8 pr-3 py-1.5 text-xs text-white outline-none focus:border-blue-500"
                      />
                    </div>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse text-xs">
                      <thead>
                        <tr className="bg-slate-950/80 border-b border-slate-800 text-slate-400 font-semibold">
                          <th className="p-3">No</th>
                          <th className="p-3">Nama Siswa</th>
                          <th className="p-3">NISN</th>
                          <th className="p-3 text-center">Hapus</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {filteredStudents.map((s, idx) => (
                          <tr key={s.id} className="hover:bg-slate-800/40 transition-all">
                            <td className="p-3 text-slate-500 font-mono">{idx + 1}</td>
                            <td className="p-3 font-bold text-white">{s.name}</td>
                            <td className="p-3 text-slate-400 font-mono">{s.nisn || '-'}</td>
                            <td className="p-3 text-center">
                              <button 
                                onClick={() => handleDeleteStudent(s.id)}
                                className="p-1.5 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white rounded-lg border border-rose-500/20 transition-all"
                                title="Hapus Siswa"
                              >
                                <UserX className="w-3.5 h-3.5"/>
                              </button>
                            </td>
                          </tr>
                        ))}

                        {filteredStudents.length === 0 && (
                          <tr>
                            <td colSpan="4" className="p-8 text-center text-slate-500 text-xs">
                              Belum ada siswa terdaftar di Kelas {filterKelas}{filterSubKelas}. Tambahkan siswa melalui form di samping.
                            </td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: KELOLA MATERI IPS */}
            {activeTab === 'materials' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                {/* Form Buat / Edit Materi */}
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4 h-fit">
                  <h3 className="text-base font-extrabold text-white flex items-center gap-2">
                    <BookOpen className="w-5 h-5 text-blue-400" /> {isEditMat ? 'Edit Materi IPS' : 'Terbitkan Materi IPS'}
                  </h3>

                  <form onSubmit={handleSaveMaterial} className="space-y-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Judul Materi</label>
                      <input 
                        type="text" 
                        required 
                        placeholder="Contoh: Interaksi Sosial dan Dinamika Masyarakat" 
                        value={matForm.title}
                        onChange={e => setMatForm({ ...matForm, title: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-blue-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Durasi Membaca (Menit)</label>
                      <input 
                        type="number" 
                        min="1" 
                        required 
                        value={matForm.durationMinutes}
                        onChange={e => setMatForm({ ...matForm, durationMinutes: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-blue-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">URL Gambar Header (Opsional)</label>
                      <input 
                        type="url" 
                        placeholder="https://images.unsplash.com/..." 
                        value={matForm.imageUrl}
                        onChange={e => setMatForm({ ...matForm, imageUrl: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-blue-500"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Isi Pembelajaran Materi</label>
                      <textarea 
                        rows="6" 
                        required 
                        placeholder="Tuliskan teks materi bacaan di sini..." 
                        value={matForm.content}
                        onChange={e => setMatForm({ ...matForm, content: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-blue-500"
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Sumber Referensi / Buku</label>
                      <input 
                        type="text" 
                        placeholder="Buku Paket IPS SMP Kelas 7 Kemendikbud" 
                        value={matForm.source}
                        onChange={e => setMatForm({ ...matForm, source: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-blue-500"
                      />
                    </div>

                    <div className="flex gap-2 pt-2">
                      <button 
                        type="submit" 
                        className="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl transition-all shadow-lg shadow-blue-600/30 text-xs flex justify-center items-center gap-2"
                      >
                        {isEditMat ? 'Update Materi' : 'Terbitkan Materi'}
                      </button>

                      {isEditMat && (
                        <button 
                          type="button" 
                          onClick={() => { setIsEditMat(false); setMatForm({ id: '', title: '', content: '', durationMinutes: 15, source: '', imageUrl: '' }); }}
                          className="px-4 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold"
                        >
                          Batal
                        </button>
                      )}
                    </div>
                  </form>
                </div>

                {/* List Materi Terbit */}
                <div className="lg:col-span-2 space-y-4">
                  <h3 className="text-base font-extrabold text-white">Materi Diterbitkan untuk Kelas {filterKelas}</h3>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {filteredMaterials.map((m) => (
                      <div key={m.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between space-y-3 relative overflow-hidden shadow-lg">
                        <div>
                          <div className="flex justify-between items-center mb-2">
                            <span className="bg-blue-500/10 text-blue-400 border border-blue-500/20 text-[10px] font-bold px-2 py-0.5 rounded-lg">
                              Kelas {m.kelas}
                            </span>
                            <span className="text-amber-400 font-mono text-[11px] flex items-center gap-1">
                              <Clock className="w-3 h-3"/> {m.durationMinutes} Menit
                            </span>
                          </div>
                          <h4 className="font-bold text-white text-sm line-clamp-1">{m.title}</h4>
                          <p className="text-slate-400 text-xs line-clamp-3 mt-1">{m.content}</p>
                        </div>

                        <div className="flex justify-end items-center gap-2 pt-2 border-t border-slate-800/80">
                          <button 
                            onClick={() => { setMatForm(m); setIsEditMat(true); }}
                            className="p-1.5 bg-blue-500/10 hover:bg-blue-500 text-blue-400 hover:text-white rounded-lg border border-blue-500/20 transition-all text-xs flex items-center gap-1"
                          >
                            <Edit3 className="w-3.5 h-3.5"/> Edit
                          </button>
                          <button 
                            onClick={() => handleDeleteMaterial(m.id)}
                            className="p-1.5 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white rounded-lg border border-rose-500/20 transition-all text-xs flex items-center gap-1"
                          >
                            <Trash2 className="w-3.5 h-3.5"/> Hapus
                          </button>
                        </div>
                      </div>
                    ))}

                    {filteredMaterials.length === 0 && (
                      <div className="col-span-full bg-slate-900 border border-dashed border-slate-800 rounded-3xl p-8 text-center text-slate-500 text-xs">
                        Belum ada materi IPS yang diterbitkan untuk Kelas {filterKelas}.
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: BANK SOAL EVALUASI */}
            {activeTab === 'questions' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                {/* Form Buat Soal */}
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl space-y-4 h-fit">
                  <h3 className="text-base font-extrabold text-white flex items-center gap-2">
                    <HelpCircle className="w-5 h-5 text-blue-400" /> Tambah Soal Evaluasi
                  </h3>

                  <form onSubmit={handleSaveQuestion} className="space-y-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Pilih Materi Pembelajaran</label>
                      <select 
                        value={questForm.materialId}
                        onChange={e => setQuestForm({ ...questForm, materialId: e.target.value })}
                        required
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-blue-500"
                      >
                        <option value="">-- Pilih Materi IPS --</option>
                        {filteredMaterials.map(m => (
                          <option key={m.id} value={m.id}>{m.title}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Pertanyaan / Pertanyaan Kuis</label>
                      <textarea 
                        rows="3" 
                        required 
                        placeholder="Tuliskan pertanyaan..." 
                        value={questForm.questionText}
                        onChange={e => setQuestForm({ ...questForm, questionText: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white outline-none focus:border-blue-500"
                      ></textarea>
                    </div>

                    <div className="space-y-2 border-t border-b border-slate-800 py-3">
                      <p className="text-[11px] font-bold text-slate-400">Pilihan Jawaban (Ganda):</p>
                      {['A', 'B', 'C', 'D'].map(key => (
                        <div key={key} className="flex items-center gap-2">
                          <span className="font-bold text-xs text-slate-400 w-4">{key}.</span>
                          <input 
                            type="text" 
                            required
                            placeholder={`Pilihan ${key}`}
                            value={questForm[`option${key}`]}
                            onChange={e => setQuestForm({ ...questForm, [`option${key}`]: e.target.value })}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-white outline-none focus:border-blue-500"
                          />
                        </div>
                      ))}
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-400 mb-1">Kunci Jawaban Benar</label>
                      <select 
                        value={questForm.correctAnswer}
                        onChange={e => setQuestForm({ ...questForm, correctAnswer: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white outline-none focus:border-blue-500"
                      >
                        <option value="A">Pilihan A</option>
                        <option value="B">Pilihan B</option>
                        <option value="C">Pilihan C</option>
                        <option value="D">Pilihan D</option>
                      </select>
                    </div>

                    <button 
                      type="submit" 
                      className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl transition-all shadow-lg shadow-blue-600/30 text-xs flex justify-center items-center gap-2"
                    >
                      <Plus className="w-4 h-4"/> Simpan Soal Kuis
                    </button>
                  </form>
                </div>

                {/* List Bank Soal */}
                <div className="lg:col-span-2 space-y-4">
                  <h3 className="text-base font-extrabold text-white">Daftar Soal Evaluasi</h3>
                  <div className="space-y-3">
                    {questions.map((q, idx) => {
                      const parentMat = materials.find(m => m.id === q.materialId);
                      return (
                        <div key={q.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3 shadow-lg">
                          <div className="flex justify-between items-start gap-4">
                            <div>
                              <span className="text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded font-semibold">
                                {parentMat ? parentMat.title : 'Materi Terhapus'}
                              </span>
                              <h4 className="font-bold text-white text-xs mt-2">{idx + 1}. {q.questionText}</h4>
                            </div>
                            <button 
                              onClick={() => handleDeleteQuestion(q.id)}
                              className="p-1.5 bg-rose-500/10 hover:bg-rose-500 text-rose-400 hover:text-white rounded-lg border border-rose-500/20 transition-all"
                            >
                              <Trash2 className="w-3.5 h-3.5"/>
                            </button>
                          </div>

                          <div className="grid grid-cols-2 gap-2 text-xs">
                            {['A', 'B', 'C', 'D'].map(k => (
                              <div key={k} className={`p-2 rounded-xl border ${q.correctAnswer === k ? 'bg-emerald-500/10 border-emerald-500/40 text-emerald-300 font-bold' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>
                                {k}. {q[`option${k}`]}
                              </div>
                            ))}
                          </div>
                        </div>
                      );
                    })}

                    {questions.length === 0 && (
                      <div className="bg-slate-900 border border-dashed border-slate-800 rounded-3xl p-8 text-center text-slate-500 text-xs">
                        Belum ada soal evaluasi yang dibuat.
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: REKAP NILAI EVALUASI */}
            {activeTab === 'scores' && (
              <div className="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-xl p-6 space-y-4">
                <h3 className="text-base font-extrabold text-white flex items-center gap-2">
                  <Award className="w-5 h-5 text-amber-400" /> Rekapitulasi Nilai Evaluasi Siswa Kelas {filterKelas}{filterSubKelas}
                </h3>

                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse text-xs">
                    <thead>
                      <tr className="bg-slate-950/80 border-b border-slate-800 text-slate-400 font-semibold">
                        <th className="p-3">Nama Siswa</th>
                        <th className="p-3">Materi Evaluasi</th>
                        <th className="p-3">Nilai Selesai</th>
                        <th className="p-3">Waktu Selesai</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/60">
                      {scores.filter(sc => sc.kelas === filterKelas && sc.subKelas === filterSubKelas).map((sc) => (
                        <tr key={sc.id} className="hover:bg-slate-800/40 transition-all">
                          <td className="p-3 font-bold text-white">{sc.studentName}</td>
                          <td className="p-3 text-slate-300">{sc.materialTitle}</td>
                          <td className="p-3 font-mono font-extrabold text-emerald-400 text-sm">{sc.score} / 100</td>
                          <td className="p-3 text-slate-500">{new Date(sc.createdAt).toLocaleString('id-ID')}</td>
                        </tr>
                      ))}

                      {scores.filter(sc => sc.kelas === filterKelas && sc.subKelas === filterSubKelas).length === 0 && (
                        <tr>
                          <td colSpan="4" className="p-8 text-center text-slate-500 text-xs">
                            Belum ada rekap nilai kuis untuk Kelas {filterKelas}{filterSubKelas}.
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<TeacherApp />);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal Guru - E-Learning IPS</title>

  <!-- Google Font & Tailwind CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Babel Standalone untuk JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>

  <!-- Import Map React & Firebase -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js",
        "lucide-react": "https://esm.sh/lucide-react@0.263.1"
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    import { initializeApp } from 'firebase/app';
    import { getAuth, signInAnonymously, signInWithCustomToken } from 'firebase/auth';
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from 'firebase/firestore';
    import { 
      Users, BookOpen, HelpCircle, Award, Plus, Trash2, 
      RotateCcw, StopCircle, RefreshCw, AlertTriangle, CheckCircle2, 
      X, FileText, UserPlus, Layers, ShieldCheck
    } from 'lucide-react';

    // Konfigurasi Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD3M8FfqHdzCRO3VCKB24xPEcEZgVVK--M",
      authDomain: "gen-lang-client-0031221493.firebaseapp.com",
      databaseURL: "https://gen-lang-client-0031221493-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gen-lang-client-0031221493",
      storageBucket: "gen-lang-client-0031221493.firebasestorage.app",
      messagingSenderId: "514951591302",
      appId: "1:514951591302:web:65d128106e2d2f3663e807",
      measurementId: "G-VF7M8CDSYQ"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'elearning-ips-v3';

    // BroadcastChannel Sync Realtime
    const broadcast = typeof window !== 'undefined' && 'BroadcastChannel' in window
      ? new BroadcastChannel('elearning_ips_realtime_channel')
      : null;

    function TeacherApp() {
      const [activeTab, setActiveTab] = useState('monitoring');

      // States Data Realtime
      const [students, setStudents] = useState([]);
      const [materials, setMaterials] = useState([]);
      const [questions, setQuestions] = useState([]);
      const [presenceList, setPresenceList] = useState([]);
      const [scores, setScores] = useState([]);

      // State Filter Monitoring Sesi Siswa
      const [filterKelas, setFilterKelas] = useState('7');
      const [filterSubKelas, setFilterSubKelas] = useState('A');

      // Form Add Student
      const [newStudentName, setNewStudentName] = useState('');
      const [newStudentNISN, setNewStudentNISN] = useState('');
      const [newStudentKelas, setNewStudentKelas] = useState('7');
      const [newStudentSubKelas, setNewStudentSubKelas] = useState('A');

      // Form Add Material
      const [matTitle, setMatTitle] = useState('');
      const [matKelas, setMatKelas] = useState('7');
      const [matSubKelasTarget, setMatSubKelasTarget] = useState('semua');
      const [matDuration, setMatDuration] = useState('15');
      const [matContent, setMatContent] = useState('');
      const [matImage, setMatImage] = useState('');
      const [matSource, setMatSource] = useState('');

      // Form Add Question
      const [qMaterialId, setQMaterialId] = useState('');
      const [qType, setQType] = useState('pg');
      const [qText, setQText] = useState('');
      const [qOptA, setQOptA] = useState('');
      const [qOptB, setQOptB] = useState('');
      const [qOptC, setQOptC] = useState('');
      const [qOptD, setQOptD] = useState('');
      const [qCorrect, setQCorrect] = useState('A');

      // Firebase Auth & Realtime Sync
      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.log("Firebase Fallback Mode");
          }
        };
        initAuth();

        // 1. Sync Students
        const unsubStudents = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'students'), (snap) => {
          const list = snap.docs.map(doc => doc.data());
          setStudents(list);
          localStorage.setItem('elearning_students_v3', JSON.stringify(list));
        }, () => {
          const local = localStorage.getItem('elearning_students_v3');
          if (local) setStudents(JSON.parse(local));
        });

        // 2. Sync Materials
        const unsubMaterials = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'materials'), (snap) => {
          const list = snap.docs.map(doc => doc.data());
          setMaterials(list);
          if (list.length > 0 && !qMaterialId) setQMaterialId(list[0].id);
          localStorage.setItem('elearning_materials_v3', JSON.stringify(list));
        }, () => {
          const local = localStorage.getItem('elearning_materials_v3');
          if (local) setMaterials(JSON.parse(local));
        });

        // 3. Sync Questions
        const unsubQuestions = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'questions'), (snap) => {
          const list = snap.docs.map(doc => doc.data());
          setQuestions(list);
          localStorage.setItem('elearning_questions_v3', JSON.stringify(list));
        }, () => {
          const local = localStorage.getItem('elearning_questions_v3');
          if (local) setQuestions(JSON.parse(local));
        });

        // 4. Sync Presence (Monitoring Live Sesi)
        const unsubPresence = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'student_presence'), (snap) => {
          const list = snap.docs.map(doc => doc.data());
          setPresenceList(list);
        });

        // 5. Sync Scores
        const unsubScores = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'scores'), (snap) => {
          const list = snap.docs.map(doc => doc.data());
          setScores(list);
          localStorage.setItem('elearning_scores_v3', JSON.stringify(list));
        }, () => {
          const local = localStorage.getItem('elearning_scores_v3');
          if (local) setScores(JSON.parse(local));
        });

        return () => {
          unsubStudents();
          unsubMaterials();
          unsubQuestions();
          unsubPresence();
          unsubScores();
        };
      }, []);

      // Broadcast Listener
      useEffect(() => {
        if (!broadcast) return;
        const handleMessage = (event) => {
          const { type, payload } = event.data || {};
          if (type === 'STUDENT_PRESENCE_UPDATE') {
            setPresenceList(prev => {
              const idx = prev.findIndex(p => p.id === payload.id);
              if (idx >= 0) {
                const nextArr = [...prev];
                nextArr[idx] = payload;
                return nextArr;
              }
              return [payload, ...prev];
            });
          }
        };
        broadcast.addEventListener('message', handleMessage);
        return () => broadcast.removeEventListener('message', handleMessage);
      }, []);

      // ACTION 1: Tambah Siswa Baru
      const handleAddStudent = async (e) => {
        e.preventDefault();
        if (!newStudentName.trim()) return;

        const newId = 'stu_' + Date.now();
        const studentObj = {
          id: newId,
          name: newStudentName.trim(),
          nisn: newStudentNISN.trim() || '-',
          kelas: newStudentKelas,
          subKelas: newStudentSubKelas,
          createdAt: Date.now()
        };

        const updated = [...students, studentObj];
        setStudents(updated);
        localStorage.setItem('elearning_students_v3', JSON.stringify(updated));

        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', newId), studentObj);
        } catch (err) {}

        setNewStudentName('');
        setNewStudentNISN('');
      };

      // ACTION 2: Hapus Siswa Individual
      const handleDeleteStudent = async (id) => {
        if (!confirm('Apakah Anda yakin ingin menghapus data siswa ini?')) return;
        const updated = students.filter(s => s.id !== id);
        setStudents(updated);
        localStorage.setItem('elearning_students_v3', JSON.stringify(updated));

        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', id));
        } catch (err) {}
      };

      // ACTION 3: HAPUS KELAS YANG DIPILIH (Beserta seluruh data siswa di kelas tersebut)
      const handleDeleteSelectedClass = async () => {
        const targetLabel = `Kelas ${filterKelas} (Rombel ${filterSubKelas})`;
        const studentsInClass = students.filter(s => s.kelas === filterKelas && s.subKelas === filterSubKelas);

        if (studentsInClass.length === 0) {
          alert(`Tidak ada data siswa di ${targetLabel} untuk dihapus.`);
          return;
        }

        if (!confirm(`PERINGATAN TINGGI!\nApakah Anda yakin ingin MENGHAPUS SELURUH KELAS ${targetLabel}?\nSebanyak ${studentsInClass.length} siswa di kelas ini akan dihapus permanen.`)) {
          return;
        }

        // Filter daftar siswa lokal
        const remainingStudents = students.filter(s => !(s.kelas === filterKelas && s.subKelas === filterSubKelas));
        setStudents(remainingStudents);
        localStorage.setItem('elearning_students_v3', JSON.stringify(remainingStudents));

        // Hapus Firestore
        for (const stu of studentsInClass) {
          try {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'students', stu.id));
          } catch (e) {}
        }

        // Hapus juga presensi dan skor siswa yang ada di kelas ini
        const presencesToDelete = presenceList.filter(p => p.kelas === `${filterKelas}${filterSubKelas}`);
        for (const p of presencesToDelete) {
          try {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', p.id));
          } catch (e) {}
        }

        alert(`Seluruh data ${targetLabel} berhasil dihapus.`);
      };

      // ACTION 4: HENTIKAN SESI SISWA
      const handleStopSession = async (presence) => {
        if (!confirm(`Hentikan sesi membaca/kuis untuk ${presence.studentName}?`)) return;

        const updatedPayload = {
          ...presence,
          remainingSeconds: 0,
          status: 'stopped',
          lastUpdated: Date.now()
        };

        if (broadcast) broadcast.postMessage({ type: 'TEACHER_RESET_STATUS', payload: updatedPayload });

        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presence.id), updatedPayload);
        } catch (e) {}
      };

      // ACTION 5: RESET SESI SISWA (Normal kembali / Buka Peringatan Tab)
      const handleResetSession = async (presence) => {
        if (!confirm(`Reset sesi peringatan untuk ${presence.studentName}? Siswa akan dapat melanjutkan kembali.`)) return;

        const updatedPayload = {
          ...presence,
          status: 'active',
          lastUpdated: Date.now()
        };

        if (broadcast) broadcast.postMessage({ type: 'TEACHER_RESET_STATUS', payload: updatedPayload });

        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presence.id), updatedPayload);
        } catch (e) {}
      };

      // ACTION 6: HAPUS SESI SISWA
      const handleDeleteSession = async (presenceId) => {
        if (!confirm('Hapus riwayat/rekaman sesi siswa ini dari pemantauan?')) return;

        setPresenceList(prev => prev.filter(p => p.id !== presenceId));
        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'student_presence', presenceId));
        } catch (e) {}
      };

      // ACTION 7: Tambah Materi Baru
      const handleAddMaterial = async (e) => {
        e.preventDefault();
        if (!matTitle.trim() || !matContent.trim()) return;

        const matId = 'mat_' + Date.now();
        const matObj = {
          id: matId,
          title: matTitle.trim(),
          kelas: matKelas,
          subKelasTarget: matSubKelasTarget,
          durationMinutes: parseInt(matDuration) || 15,
          content: matContent.trim(),
          imageUrl: matImage.trim(),
          source: matSource.trim(),
          createdBy: 'Guru Pengajar IPS',
          createdAt: Date.now()
        };

        const updated = [matObj, ...materials];
        setMaterials(updated);
        localStorage.setItem('elearning_materials_v3', JSON.stringify(updated));

        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', matId), matObj);
        } catch (e) {}

        setMatTitle('');
        setMatContent('');
        setMatImage('');
        setMatSource('');
        alert('Materi IPS berhasil diterbitkan!');
      };

      // ACTION 8: Hapus Materi
      const handleDeleteMaterial = async (id) => {
        if (!confirm('Hapus materi pembelajaran ini? Soal terkait juga akan dibersihkan.')) return;

        const updated = materials.filter(m => m.id !== id);
        setMaterials(updated);
        localStorage.setItem('elearning_materials_v3', JSON.stringify(updated));

        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'materials', id));
        } catch (e) {}
      };

      // ACTION 9: Tambah Soal
      const handleAddQuestion = async (e) => {
        e.preventDefault();
        if (!qText.trim() || !qMaterialId) return;

        const qId = 'q_' + Date.now();
        const qObj = {
          id: qId,
          materialId: qMaterialId,
          type: qType,
          questionText: qText.trim(),
          optionA: qType === 'pg' ? qOptA.trim() : '',
          optionB: qType === 'pg' ? qOptB.trim() : '',
          optionC: qType === 'pg' ? qOptC.trim() : '',
          optionD: qType === 'pg' ? qOptD.trim() : '',
          correctAnswer: qType === 'pg' ? qCorrect : qCorrect.trim(),
          createdAt: Date.now()
        };

        const updated = [qObj, ...questions];
        setQuestions(updated);
        localStorage.setItem('elearning_questions_v3', JSON.stringify(updated));

        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'questions', qId), qObj);
        } catch (e) {}

        setQText('');
        setQOptA('');
        setQOptB('');
        setQOptC('');
        setQOptD('');
        alert('Soal evaluasi berhasil ditambahkan!');
      };

      // ACTION 10: Hapus Soal
      const handleDeleteQuestion = async (id) => {
        if (!confirm('Hapus soal evaluasi ini?')) return;
        const updated = questions.filter(q => q.id !== id);
        setQuestions(updated);
        localStorage.setItem('elearning_questions_v3', JSON.stringify(updated));

        try {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'questions', id));
        } catch (e) {}
      };

      // Filter Data Monitoring Realtime
      const filteredPresence = presenceList.filter(p => p.kelas === `${filterKelas}${filterSubKelas}`);
      const filteredClassStudents = students.filter(s => s.kelas === filterKelas && s.subKelas === filterSubKelas);

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 pb-12">
          {/* Top Navbar */}
          <nav className="bg-slate-900 border-b border-slate-800 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap justify-between items-center gap-4">
              <div className="flex items-center gap-3">
                <div className="bg-gradient-to-tr from-blue-600 to-indigo-600 p-2.5 rounded-2xl shadow-lg shadow-blue-500/20">
                  <ShieldCheck className="w-6 h-6 text-white" />
                </div>
                <div>
                  <h1 className="text-base font-extrabold text-white tracking-tight">Portal Guru IPS</h1>
                  <p className="text-[11px] text-slate-400">Pusat Kendali E-Learning Realtime</p>
                </div>
              </div>

              {/* Menu Navigasi Tab */}
              <div className="flex items-center gap-1.5 bg-slate-950 p-1 rounded-2xl border border-slate-800 text-xs">
                <button 
                  onClick={() => setActiveTab('monitoring')}
                  className={`px-3.5 py-2 rounded-xl font-bold flex items-center gap-2 transition-all ${activeTab === 'monitoring' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'text-slate-400 hover:text-white'}`}
                >
                  <Users className="w-4 h-4" /> Monitoring Live Sesi
                </button>
                <button 
                  onClick={() => setActiveTab('siswa')}
                  className={`px-3.5 py-2 rounded-xl font-bold flex items-center gap-2 transition-all ${activeTab === 'siswa' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'text-slate-400 hover:text-white'}`}
                >
                  <UserPlus className="w-4 h-4" /> Kelola Data Siswa
                </button>
                <button 
                  onClick={() => setActiveTab('materi')}
                  className={`px-3.5 py-2 rounded-xl font-bold flex items-center gap-2 transition-all ${activeTab === 'materi' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'text-slate-400 hover:text-white'}`}
                >
                  <BookOpen className="w-4 h-4" /> Kelola Materi
                </button>
                <button 
                  onClick={() => setActiveTab('soal')}
                  className={`px-3.5 py-2 rounded-xl font-bold flex items-center gap-2 transition-all ${activeTab === 'soal' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'text-slate-400 hover:text-white'}`}
                >
                  <HelpCircle className="w-4 h-4" /> Soal Evaluasi
                </button>
                <button 
                  onClick={() => setActiveTab('nilai')}
                  className={`px-3.5 py-2 rounded-xl font-bold flex items-center gap-2 transition-all ${activeTab === 'nilai' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'text-slate-400 hover:text-white'}`}
                >
                  <Award className="w-4 h-4" /> Rekap Nilai
                </button>
              </div>
            </div>
          </nav>

          <main className="max-w-7xl mx-auto px-4 py-6">

            {/* TAB 1: MONITORING LIVE SESI & KONTROL SESI SISWA */}
            {activeTab === 'monitoring' && (
              <div className="space-y-6">
                <div className="bg-slate-900 border border-slate-800 p-5 rounded-3xl flex flex-wrap justify-between items-center gap-4">
                  <div>
                    <h2 className="text-lg font-bold text-white flex items-center gap-2">
                      <Users className="w-5 h-5 text-blue-400" /> Pemantauan Realtime Sesi Membaca Siswa
                    </h2>
                    <p className="text-slate-400 text-xs mt-0.5">Pantau status membaca siswa, hentikan, reset, atau hapus sesi secara efisien.</p>
                  </div>

                  <div className="flex items-center gap-3">
                    <div className="flex items-center gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800 text-xs">
                      <span className="text-slate-400 font-semibold px-2">Kelas:</span>
                      <select 
                        value={filterKelas} 
                        onChange={(e) => setFilterKelas(e.target.value)}
                        className="bg-slate-900 border border-slate-800 text-white font-bold rounded-lg px-2.5 py-1 text-xs outline-none"
                      >
                        <option value="7">Kelas 7</option>
                        <option value="8">Kelas 8</option>
                        <option value="9">Kelas 9</option>
                      </select>
                      <select 
                        value={filterSubKelas} 
                        onChange={(e) => setFilterSubKelas(e.target.value)}
                        className="bg-slate-900 border border-slate-800 text-white font-bold rounded-lg px-2.5 py-1 text-xs outline-none"
                      >
                        <option value="A">Rombel A</option>
                        <option value="B">Rombel B</option>
                        <option value="C">Rombel C</option>
                        <option value="D">Rombel D</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {filteredPresence.map((p) => {
                    const mins = Math.floor((p.remainingSeconds || 0) / 60);
                    const secs = (p.remainingSeconds || 0) % 60;
                    const formattedTime = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

                    return (
                      <div key={p.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 relative overflow-hidden">
                        <div className="flex justify-between items-start">
                          <div>
                            <h3 className="font-bold text-white text-sm">{p.studentName}</h3>
                            <p className="text-[11px] text-slate-400">Materi: <span className="text-slate-200">{p.materialTitle}</span></p>
                          </div>
                          
                          {p.status === 'active' && (
                            <span className="bg-emerald-500/10 text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded-lg border border-emerald-500/20 flex items-center gap-1">
                              <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> Aktif
                            </span>
                          )}
                          {p.status === 'warning' && (
                            <span className="bg-yellow-500/10 text-yellow-400 text-[10px] font-bold px-2 py-0.5 rounded-lg border border-yellow-500/20 flex items-center gap-1">
                              <AlertTriangle className="w-3 h-3 text-yellow-400" /> Pindah Tab
                            </span>
                          )}
                          {p.status === 'stopped' && (
                            <span className="bg-red-500/10 text-red-400 text-[10px] font-bold px-2 py-0.5 rounded-lg border border-red-500/20 flex items-center gap-1">
                              <StopCircle className="w-3 h-3 text-red-400" /> Dihentikan
                            </span>
                          )}
                          {p.status === 'completed' && (
                            <span className="bg-blue-500/10 text-blue-400 text-[10px] font-bold px-2 py-0.5 rounded-lg border border-blue-500/20 flex items-center gap-1">
                              <CheckCircle2 className="w-3 h-3 text-blue-400" /> Selesai
                            </span>
                          )}
                        </div>

                        <div className="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center text-xs font-mono">
                          <span className="text-slate-400 font-sans text-[11px]">Sisa Waktu:</span>
                          <span className="font-bold text-amber-400">{formattedTime}</span>
                        </div>

                        {/* TOMBOL AKSI: HENTIKAN, RESET, HAPUS SESI */}
                        <div className="pt-2 border-t border-slate-800 flex items-center gap-2">
                          <button 
                            onClick={() => handleStopSession(p)}
                            title="Hentikan Sesi Membaca Siswa Ini"
                            className="flex-1 bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white border border-red-500/30 py-1.5 rounded-xl text-[11px] font-bold transition-all flex justify-center items-center gap-1"
                          >
                            <StopCircle className="w-3.5 h-3.5" /> Hentikan Sesi
                          </button>

                          <button 
                            onClick={() => handleResetSession(p)}
                            title="Reset Peringatan / Aktifkan Kembali Sesi"

                          >
                            <RotateCcw className="w-3.5 h-3.5" /> Reset Sesi
                          </button>

                          <button 
                            onClick={() => handleDeleteSession(p.id)}
                            title="Hapus Rekaman Sesi Ini"
                            className="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-red-400 rounded-xl transition-all"
                          >
                            <Trash2 className="w-3.5 h-3.5" />
                          </button>
                        </div>
                      </div>
                    );

                    <div className="col-span-full bg-slate-900/50 border border-dashed border-slate-800 rounded-3xl p-12 text-center text-slate-500">

                      <p className="text-[11px] text-slate-600 mt-1">Sesi siswa akan otomatis muncul di sini ketika siswa membuka materi IPS.</p>
                    </div>
                  )}
                </div>
              </div>
            )}

                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                  {/* Form Tambah Siswa */}
                  <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 h-fit">
                    <h2 className="text-sm font-bold text-white flex items-center gap-2">
                      <UserPlus className="w-4 h-4 text-blue-400" /> Tambah Data Siswa Baru
                    </h2>

                    <form onSubmit={handleAddStudent} className="space-y-3">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-400 mb-1">Nama Lengkap Siswa</label>
                        <input 
                          type="text" 
                          required
                          value={newStudentName}
                          onChange={(e) => setNewStudentName(e.target.value)}
                          placeholder="Contoh: Ahmad Subagja" 
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-blue-500"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold text-slate-400 mb-1">NISN (Opsional)</label>
                        <input 
                          type="text" 
                          value={newStudentNISN}
                          onChange={(e) => setNewStudentNISN(e.target.value)}
                          placeholder="0081234567" 
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-blue-500"
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        <div>
                          <label className="block text-[11px] font-semibold text-slate-400 mb-1">Tingkat Kelas</label>

                            value={newStudentKelas}
                            onChange={(e) => setNewStudentKelas(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none"
                          >
                            <option value="7">Kelas 7</option>
                            <option value="8">Kelas 8</option>
                            <option value="9">Kelas 9</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-[11px] font-semibold text-slate-400 mb-1">Rombel</label>
                          <select 
                            value={newStudentSubKelas}
                            onChange={(e) => setNewStudentSubKelas(e.target.value)}
                            className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none"
                          >
                            <option value="A">Rombel A</option>
                            <option value="B">Rombel B</option>
                            <option value="C">Rombel C</option>
                            <option value="D">Rombel D</option>
                          </select>
                        </div>
                      </div>

                      <button 
                        type="submit" 
                        className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-md shadow-blue-600/20 flex justify-center items-center gap-2 active:scale-95"
                      >
                        <Plus className="w-4 h-4" /> Simpan Data Siswa
                      </button>
                    </form>
                  </div>

                  {/* Tabel Daftar Siswa & Fitur Hapus Kelas Terpilih */}
                  <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">
                    <div className="flex flex-wrap justify-between items-center gap-3 border-b border-slate-800 pb-4">
                      <div>
                        <h2 className="text-sm font-bold text-white flex items-center gap-2">
                          <Layers className="w-4 h-4 text-emerald-400" /> Daftar Siswa Terdaftar
                        </h2>
                        <p className="text-[11px] text-slate-400">Total {filteredClassStudents.length} siswa di Kelas {filterKelas}{filterSubKelas}</p>
                      </div>

                      <div className="flex items-center gap-2">
                        <select 
                          value={filterKelas} 
                          onChange={(e) => setFilterKelas(e.target.value)}
                          className="bg-slate-950 border border-slate-800 text-white font-bold rounded-xl px-2.5 py-1.5 text-xs outline-none"
                        >
                          <option value="7">Kelas 7</option>
                          <option value="8">Kelas 8</option>
                          <option value="9">Kelas 9</option>
                        </select>
                        <select 
                          value={filterSubKelas} 
                          onChange={(e) => setFilterSubKelas(e.target.value)}
                          className="bg-slate-950 border border-slate-800 text-white font-bold rounded-xl px-2.5 py-1.5 text-xs outline-none"
                        >
                          <option value="A">Rombel A</option>
                          <option value="B">Rombel B</option>
                          <option value="C">Rombel C</option>
                          <option value="D">Rombel D</option>
                        </select>

                        {/* TOMBOL HAPUS KELAS YANG DIPILIH */}
                        <button 
                          onClick={handleDeleteSelectedClass}
                          title="Hapus Seluruh Data Siswa di Kelas Terpilih Ini"
                          className="bg-red-600/20 hover:bg-red-600 text-red-300 hover:text-white border border-red-500/30 px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5"
                        >
                          <Trash2 className="w-3.5 h-3.5" /> Hapus Kelas Ini
                        </button>
                      </div>
                    </div>

                      <table className="w-full text-left text-xs">
                        <thead>
                          <tr className="border-b border-slate-800 text-slate-400">
                            <th className="py-2.5 px-3">No</th>
                            <th className="py-2.5 px-3">Nama Siswa</th>
                            <th className="py-2.5 px-3">NISN</th>
                            <th className="py-2.5 px-3">Kelas</th>
                            <th className="py-2.5 px-3 text-right">Aksi</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/50 text-slate-300">
                          {filteredClassStudents.map((s, idx) => (
                            <tr key={s.id} className="hover:bg-slate-800/40 transition-colors">
                              <td className="py-2.5 px-3 font-mono">{idx + 1}</td>
                              <td className="py-2.5 px-3 font-semibold text-white">{s.name}</td>
                              <td className="py-2.5 px-3 font-mono text-slate-400">{s.nisn || '-'}</td>

                                <span className="bg-slate-800 px-2 py-0.5 rounded text-[10px] font-bold text-slate-300">
                                  Kelas {s.kelas}{s.subKelas}
                                </span>
                              </td>
                              <td className="py-2.5 px-3 text-right">
                                <button 
                                  onClick={() => handleDeleteStudent(s.id)}
                                  className="p-1.5 bg-slate-800 hover:bg-red-600 text-slate-400 hover:text-white rounded-lg transition-all"
                                  title="Hapus Siswa"
                                >
                                  <Trash2 className="w-3.5 h-3.5" />
                                </button>
                              </td>
                            </tr>
                          ))}

                            <tr>
                              <td colSpan="5" className="py-8 text-center text-slate-500 italic">
                                Belum ada siswa yang ditambahkan untuk Kelas {filterKelas}{filterSubKelas}.
                              </td>
                            </tr>
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: KELOLA MATERI IPS */}
            {activeTab === 'materi' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">

                  <h2 className="text-sm font-bold text-white flex items-center gap-2">
                    <BookOpen className="w-4 h-4 text-blue-400" /> Terbitkan Materi Baru
                  </h2>

                  <form onSubmit={handleAddMaterial} className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-400 mb-1">Judul Materi Pembelajaran</label>
                      <input 
                        type="text" 
                        required
                        value={matTitle}
                        onChange={(e) => setMatTitle(e.target.value)}
                        placeholder="Contoh: Interaksi Sosial & Dinamika Masyarakat" 
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-blue-500"

                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-400 mb-1">Tingkat Kelas</label>
                        <select 
                          value={matKelas}
                          onChange={(e) => setMatKelas(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none"
                        >
                          <option value="7">Kelas 7</option>
                          <option value="8">Kelas 8</option>
                          <option value="9">Kelas 9</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold text-slate-400 mb-1">Target Rombel</label>
                        <select 
                          value={matSubKelasTarget}
                          onChange={(e) => setMatSubKelasTarget(e.target.value)}
                          className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none"
                        >
                          <option value="semua">Semua Rombel</option>
                          <option value="A">Rombel A</option>
                          <option value="B">Rombel B</option>
                          <option value="C">Rombel C</option>
                          <option value="D">Rombel D</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-400 mb-1">Durasi Membaca (Menit)</label>
                      <input 
                        type="number" 
                        required
                        value={matDuration}
                        onChange={(e) => setMatDuration(e.target.value)}
                        placeholder="15" 
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-blue-500 font-mono"
                      />
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-400 mb-1">URL Gambar Header (Opsional)</label>
                      <input 
                        type="url" 
                        value={matImage}
                        onChange={(e) => setMatImage(e.target.value)}
                        placeholder="https://..." 
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-blue-500"
                      />
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-400 mb-1">Isi Teks Materi Pembelajaran</label>
                      <textarea 
                        required
                        rows="6"
                        value={matContent}
                        onChange={(e) => setMatContent(e.target.value)}
                        placeholder="Ketikkan ringkasan modul atau materi IPS di sini..." 
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-blue-500 leading-relaxed"
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-400 mb-1">Sumber Referensi (Opsional)</label>
                      <input 
                        type="text" 
                        value={matSource}
                        onChange={(e) => setMatSource(e.target.value)}
                        placeholder="Buku Paket IPS Kemendikbud 2024" 
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-blue-500"
                      />
                    </div>

                    <button 
                      type="submit" 
                      className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-md shadow-blue-600/20 flex justify-center items-center gap-2 active:scale-95"
                    >
                      <Plus className="w-4 h-4" /> Publish Materi IPS
                    </button>
                  </form>
                </div>

                <div className="lg:col-span-2 space-y-4">
                  <h2 className="text-sm font-bold text-white flex items-center gap-2">
                    <FileText className="w-4 h-4 text-emerald-400" /> Daftar Materi IPS Yang Telah Diterbitkan
                  </h2>

                  <div className="grid grid-cols-1 gap-4">
                    {materials.map((m) => (
                      <div key={m.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between space-y-3 relative">
                        <div className="flex justify-between items-start gap-3">
                          <div>
                            <div className="flex items-center gap-2 mb-1">
                              <span className="bg-blue-500/10 text-blue-400 text-[10px] font-bold px-2 py-0.5 rounded border border-blue-500/20">
                                Kelas {m.kelas} ({m.subKelasTarget === 'semua' ? 'Semua Rombel' : `Rombel ${m.subKelasTarget}`})
                              </span>
                              <span className="text-[11px] font-mono text-amber-400">{m.durationMinutes || 15} Menit Reading</span>
                            </div>
                            <h3 className="font-bold text-white text-base">{m.title}</h3>
                          </div>

                          <button 
                            onClick={() => handleDeleteMaterial(m.id)}
                            className="p-2 bg-slate-800 hover:bg-red-600 text-slate-400 hover:text-white rounded-xl transition-all"
                            title="Hapus Materi"
                          >
                            <Trash2 className="w-4 h-4" />
                          </button>
                        </div>

                        <p className="text-xs text-slate-400 line-clamp-2 leading-relaxed">{m.content}</p>

                        <div className="pt-2 border-t border-slate-800 flex justify-between items-center text-[11px] text-slate-500">
                          <span>Sumber: {m.source || 'Modul Guru'}</span>
                          <span>Soal Dibuat: {questions.filter(q => q.materialId === m.id).length} Butir</span>
                        </div>
                      </div>
                    ))}

                    {materials.length === 0 && (
                      <div className="bg-slate-900/50 border border-dashed border-slate-800 rounded-3xl p-12 text-center text-slate-500 italic">
                        Belum ada materi IPS yang diterbitkan. Silakan isi form di samping untuk menerbitkan materi.
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: KELOLA SOAL EVALUASI */}
            {activeTab === 'soal' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4 h-fit">
                  <h2 className="text-sm font-bold text-white flex items-center gap-2">
                    <HelpCircle className="w-4 h-4 text-blue-400" /> Buat Soal Evaluasi Baru
                  </h2>

                  <form onSubmit={handleAddQuestion} className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-400 mb-1">Pilih Materi Pembelajaran</label>
                      <select 
                        value={qMaterialId} 
                        onChange={(e) => setQMaterialId(e.target.value)}
                        required
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-blue-500"
                      >
                        {materials.map(m => (
                          <option key={m.id} value={m.id}>[Kelas {m.kelas}] {m.title}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-400 mb-1">Tipe Soal</label>
                      <select 
                        value={qType} 
                        onChange={(e) => setQType(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none"
                      >
                        <option value="pg">Pilihan Ganda (PG)</option>
                        <option value="essay">Isian Singkat / Essay</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-400 mb-1">Pertanyaan Soal</label>
                      <textarea 
                        required
                        rows="3"
                        value={qText}
                        onChange={(e) => setQText(e.target.value)}
                        placeholder="Tuliskan pertanyaan evaluasi IPS..." 
                        className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none focus:border-blue-500"
                      ></textarea>
                    </div>

                    {qType === 'pg' ? (
                      <div className="space-y-2 pt-1">
                        <div>
                          <label className="block text-[10px] text-slate-400">Pilihan A</label>
                          <input type="text" required value={qOptA} onChange={(e) => setQOptA(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white" />
                        </div>
                        <div>
                          <label className="block text-[10px] text-slate-400">Pilihan B</label>
                          <input type="text" required value={qOptB} onChange={(e) => setQOptB(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white" />
                        </div>
                        <div>
                          <label className="block text-[10px] text-slate-400">Pilihan C</label>
                          <input type="text" value={qOptC} onChange={(e) => setQOptC(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white" />
                        </div>
                        <div>
                          <label className="block text-[10px] text-slate-400">Pilihan D</label>
                          <input type="text" value={qOptD} onChange={(e) => setQOptD(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white" />
                        </div>

                        <div>
                          <label className="block text-[11px] font-semibold text-slate-400 mb-1">Kunci Jawaban Benar</label>
                          <select value={qCorrect} onChange={(e) => setQCorrect(e.target.value)} className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white font-bold">
                            <option value="A">Opsi A</option>
                            <option value="B">Opsi B</option>
                            <option value="C">Opsi C</option>
                            <option value="D">Opsi D</option>
                          </select>
                        </div>
                      </div>
                    ) : (
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-400 mb-1">Kunci Jawaban Teks (Exact Match)</label>
                        <input type="text" required value={qCorrect} onChange={(e) => setQCorrect(e.target.value)} placeholder="Kata kunci jawaban benar..." className="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white outline-none" />
                      </div>
                    )}

                      type="submit" 
                      className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 rounded-xl text-xs transition-all shadow-md shadow-blue-600/20 flex justify-center items-center gap-2 active:scale-95"
                    >
                      <Plus className="w-4 h-4" /> Simpan Soal Evaluasi
                    </button>
                  </form>

                  <h2 className="text-sm font-bold text-white flex items-center gap-2">

                      const mat = materials.find(m => m.id === q.materialId);
                      return (
                        <div key={q.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2 relative">
                          <div className="flex justify-between items-start">
                            <span className="text-[10px] font-bold bg-slate-800 text-blue-400 px-2 py-0.5 rounded">
                              Materi: {mat ? mat.title : 'Umum'}
                            </span>
                            <button onClick={() => handleDeleteQuestion(q.id)} className="text-slate-500 hover:text-red-400 p-1">
                              <Trash2 className="w-3.5 h-3.5" />
                            </button>
                          </div>

                          <p className="font-semibold text-xs text-white">{idx + 1}. {q.questionText}</p>

                          {q.type === 'pg' && (
                            <div className="grid grid-cols-2 gap-2 text-[11px] text-slate-400 pt-1">
                              <div className={q.correctAnswer === 'A' ? 'text-emerald-400 font-bold' : ''}>A. {q.optionA}</div>
                              <div className={q.correctAnswer === 'B' ? 'text-emerald-400 font-bold' : ''}>B. {q.optionB}</div>
                              {q.optionC && <div className={q.correctAnswer === 'C' ? 'text-emerald-400 font-bold' : ''}>C. {q.optionC}</div>}
                              {q.optionD && <div className={q.correctAnswer === 'D' ? 'text-emerald-400 font-bold' : ''}>D. {q.optionD}</div>}
                            </div>
                          )}
                        </div>
                      );

                      <div className="bg-slate-900/50 border border-dashed border-slate-800 rounded-3xl p-12 text-center text-slate-500 italic">
                        Belum ada soal evaluasi yang dibuat.
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: REKAP NILAI SISWA */}
            {activeTab === 'nilai' && (
              <div className="bg-slate-900 border border-slate-800 rounded-3xl p-5 space-y-4">

                  <div>
                    <h2 className="text-sm font-bold text-white flex items-center gap-2">
                      <Award className="w-4 h-4 text-emerald-400" /> Rekapitulasi Hasil Evaluasi Siswa
                    </h2>
                    <p className="text-[11px] text-slate-400">Nilai otomatis terekam secara realtime saat siswa menyelesaikan latihan.</p>
                  </div>
                </div>

                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="border-b border-slate-800 text-slate-400">
                        <th className="py-2.5 px-3">No</th>
                        <th className="py-2.5 px-3">Nama Siswa</th>
                        <th className="py-2.5 px-3">Kelas</th>
                        <th className="py-2.5 px-3">Materi Evaluasi</th>
                        <th className="py-2.5 px-3 text-right">Nilai Akhir</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800/50 text-slate-300">
                      {scores.map((sc, idx) => (
                        <tr key={sc.id || idx} className="hover:bg-slate-800/40 transition-colors">
                          <td className="py-2.5 px-3 font-mono">{idx + 1}</td>
                          <td className="py-2.5 px-3 font-semibold text-white">{sc.studentName}</td>
                          <td className="py-2.5 px-3">
                            <span className="bg-slate-800 px-2 py-0.5 rounded text-[10px] font-bold text-slate-300">
                              Kelas {sc.kelas}{sc.subKelas}
                            </span>
                          </td>
                          <td className="py-2.5 px-3 text-slate-300">{sc.materialTitle}</td>
                          <td className="py-2.5 px-3 text-right font-mono font-bold text-emerald-400 text-sm">
                            {sc.score} / 100
                          </td>
                        </tr>
                      ))}

                      {scores.length === 0 && (
                        <tr>
                          <td colSpan="5" className="py-8 text-center text-slate-500 italic">
                            Belum ada rekap nilai evaluasi siswa.
                          </td>
                        </tr>
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<TeacherApp />);
  </script>
</body>
</html>
